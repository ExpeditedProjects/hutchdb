name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Docs-only PRs skip the test suite. A job skipped by its own `if:` still
  # satisfies the required `test` check; paths-ignore would leave it pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DOCS_RE: '^(CLAUDE|AGENTS|REVIEW|README|NOTES|DIVERGENCE|CHANGELOG|CONTRIBUTING|CLA)\.md$|^docs/|^\.claude/|^\.agents/|^\.github/[^/]+\.md$'
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || exit 0
          if [ -n "$files" ] && ! grep -qvE "$DOCS_RE" <<<"$files"; then
            echo "Docs-only PR; skipping the test suite."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hutch
          POSTGRES_PASSWORD: hutch
          POSTGRES_DB: hutch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the *.integration.test.ts tier — real SQL against the
      # service Postgres above. Unit tests ignore this var.
      HUTCH_TEST_DATABASE_URL: postgresql://hutch:hutch@localhost:5432/hutch_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
