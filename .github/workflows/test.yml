name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hutch
          POSTGRES_PASSWORD: hutch
          POSTGRES_DB: hutch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the *.integration.test.ts tier — real SQL against the
      # service Postgres above. Unit tests ignore this var.
      HUTCH_TEST_DATABASE_URL: postgresql://hutch:hutch@localhost:5432/hutch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
